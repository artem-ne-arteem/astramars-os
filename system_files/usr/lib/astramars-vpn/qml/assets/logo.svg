<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AstraMars: планета Марс с кошачьими ушками (Марсик) и звезда (Астра) -->
  <defs>
    <radialGradient id="planet" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="0.45" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#9a2e10"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a62"/>
      <stop offset="1" stop-color="#d9531f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.35" stop-color="#ffd97a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ушки -->
  <path d="M62 112 L70 34 L120 78 Z" fill="url(#ear)"/>
  <path d="M194 112 L186 34 L136 78 Z" fill="url(#ear)"/>
  <path d="M76 92 L80 54 L104 76 Z" fill="#ffc6a3" opacity="0.55"/>
  <path d="M180 92 L176 54 L152 76 Z" fill="#ffc6a3" opacity="0.55"/>

  <!-- планета -->
  <circle cx="128" cy="146" r="88" fill="url(#planet)"/>
  <ellipse cx="96" cy="128" rx="16" ry="11" fill="#7a240c" opacity="0.35"/>
  <ellipse cx="158" cy="176" rx="22" ry="13" fill="#7a240c" opacity="0.3"/>
  <ellipse cx="150" cy="118" rx="9" ry="6" fill="#7a240c" opacity="0.3"/>
  <path d="M48 160 Q128 188 208 150" stroke="#ffd2b0" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- звезда Астра -->
  <circle cx="206" cy="52" r="34" fill="url(#glow)"/>
  <path d="M206 24 L212 46 L234 52 L212 58 L206 80 L200 58 L178 52 L200 46 Z" fill="#fff4cc"/>
</svg>
