name: Сборка образа AstraMars OS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "0 4 * * *"   # каждый день — чтобы подтягивать обновления Fedora
  workflow_dispatch:

env:
  IMAGE_NAME: astramars-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Подготовить имена
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Собрать образ
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ steps.meta.outputs.date }}
          oci: false

      - name: Опубликовать в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
