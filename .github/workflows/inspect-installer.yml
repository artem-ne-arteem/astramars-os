name: Разбор установщика Fedora (для оформления)

# Вручную: показывает, какой интерфейс у Anaconda в установщике Kinoite и какие файлы оформления в нём есть.
on:
  workflow_dispatch:
    inputs:
      fedora:
        description: Версия Fedora
        default: "44"

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Разобрать установщик
        env:
          REL: ${{ inputs.fedora }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq squashfs-tools xorriso > /dev/null
          BASE="https://dl.fedoraproject.org/pub/fedora/linux/releases/${REL}/Kinoite/x86_64/iso"
          NAME="$(curl -fsSL "$BASE/" | grep -o 'Fedora-Kinoite-ostree-x86_64-[0-9.-]*\.iso' | head -1)"
          curl -fsSL --retry 5 -o base.iso "$BASE/$NAME"
          echo "=== Корень ISO"; xorriso -indev base.iso -ls / 2>/dev/null
          echo "=== /images"; xorriso -indev base.iso -ls /images 2>/dev/null
          xorriso -indev base.iso -osirrox on -extract /EFI/BOOT/grub.cfg grub.cfg -extract /images/install.img install.img 2>/dev/null
          echo "=== grub.cfg"; cat grub.cfg
          sudo unsquashfs -q -d stage2 install.img
          ROOT=stage2
          # install.img может содержать вложенный образ LiveOS/rootfs.img
          if [ -f stage2/LiveOS/rootfs.img ]; then sudo mkdir -p /mnt/r && sudo mount -o loop,ro stage2/LiveOS/rootfs.img /mnt/r && ROOT=/mnt/r; fi
          PY="$(ls -d $ROOT/usr/lib64/python3*/site-packages/pyanaconda)"
          echo "=== gui/__init__.py: оформление"; sed -n 715,775p "$PY/ui/gui/__init__.py"
          echo "=== profile.d"; ls $ROOT/etc/anaconda/profile.d/
          for f in $ROOT/etc/anaconda/profile.d/fedora-kinoite.conf $ROOT/etc/anaconda/profile.d/fedora.conf; do echo "--- $f"; cat "$f"; done
          echo "=== fedora-atomic.css"; cat $ROOT/usr/share/anaconda/pixmaps/atomic/fedora-atomic.css
          echo "=== fedora.css"; cat $ROOT/usr/share/anaconda/pixmaps/fedora.css
          echo "=== anaconda-gtk.css 90-140"; sed -n 90,140p $ROOT/usr/share/anaconda/anaconda-gtk.css
          echo "=== размеры картинок"; file $ROOT/usr/share/anaconda/pixmaps/atomic/*.png $ROOT/usr/share/anaconda/pixmaps/anaconda_header.png
          echo "=== product.img в initrd"; xorriso -indev base.iso -osirrox on -extract /images/pxeboot/initrd.img initrd.img 2>/dev/null
          mkdir ird && cd ird && (sudo /usr/lib/dracut/skipcpio ../initrd.img 2>/dev/null || cat ../initrd.img) | (zstd -dc 2>/dev/null || xz -dc) | sudo cpio -id --quiet 2>/dev/null; cd ..
          sudo grep -rn "product.img\|run/install/product" ird/lib/dracut ird/usr/lib/dracut ird/lib/anaconda-lib.sh ird/usr/lib/anaconda-lib.sh 2>/dev/null | head -20
          sudo find ird -name "*anaconda*" | head -20
          echo "=== где используется product в stage2"; grep -rn "run/install/product" $PY | head -10
