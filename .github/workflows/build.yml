name: Сборка образа AstraMars OS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "0 4 * * *"   # каждый день — чтобы подтягивать обновления Fedora
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Образ ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Основной образ
          - image: astramars-os
            base: ghcr.io/ublue-os/kinoite-main
            variant: standard
          # С фирменным драйвером NVIDIA (переход — в Настройках → Игры)
          - image: astramars-os-nvidia
            base: ghcr.io/ublue-os/kinoite-nvidia
            variant: nvidia
    permissions:
      contents: read
      packages: write
    steps:
      - name: Освободить место на диске (образ NVIDIA больше)
        if: matrix.variant == 'nvidia'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Получить код
        uses: actions/checkout@v5

      - name: Подготовить имена
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Собрать образ
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: ./Containerfile
          image: ${{ matrix.image }}
          tags: latest ${{ steps.meta.outputs.date }}
          oci: false
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            VARIANT=${{ matrix.variant }}

      - name: Опубликовать в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
