name: Сборка установочного ISO

# Запускается вручную: вкладка Actions → «Сборка установочного ISO» → Run workflow
on:
  workflow_dispatch:

env:
  IMAGE_NAME: astramars-os

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # выложить ISO в релиз iso-latest (его скачивает установщик для Windows)
      packages: read
    steps:
      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Получить код
        uses: actions/checkout@v5

      - name: Скачать образ
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Собрать ISO (bootc-image-builder)
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --log-level debug \
            "${{ steps.image.outputs.ref }}"
          sudo mv output/bootiso/install.iso "output/AstraMars-OS-$(date -u +%Y%m%d).iso"

      - name: Выложить ISO в релиз iso-latest (частями по 1,9 ГБ — ограничение GitHub 2 ГБ на файл)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output
          ISO="$(ls *.iso)"
          sudo chown "$(id -u)" "$ISO"
          sha256sum "$ISO" | awk '{print $1}' > "$ISO.sha256"
          split -b 1900M -d -a 2 "$ISO" "$ISO.part"
          ls -la
          gh release delete iso-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create iso-latest -R "$GITHUB_REPOSITORY" --title "AstraMars OS — установочный образ"             --notes "Установочный ISO AstraMars OS ($(date -u +%Y-%m-%d)). Скачивается установщиком для Windows (AstraMars-Setup) и собирается из частей. Вручную: скачайте все части .partNN и склейте: Windows — copy /b ${ISO}.part00+${ISO}.part01+… ${ISO}; Linux — cat ${ISO}.part* > ${ISO}. Контрольная сумма — в файле .sha256."             --latest=false "$ISO.sha256" "$ISO".part*

      - name: Выложить ISO
        uses: actions/upload-artifact@v4
        with:
          name: AstraMars-OS-ISO
          path: output/*.iso
          compression-level: 0
          retention-days: 7
